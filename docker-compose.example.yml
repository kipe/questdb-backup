# Local end-to-end stack. The password is for this compose file only.
#   docker compose -f docker-compose.example.yml up --build
#   docker compose -f docker-compose.example.yml exec questdb-backup ls -l /backups/last

services:
  questdb:
    image: questdb/questdb:10.2.0
    environment:
      QDB_HTTP_USER: questdb
      QDB_HTTP_PASSWORD: questdb
      QDB_PG_USER: questdb
      QDB_PG_PASSWORD: questdb
      QDB_HTTP_HEALTH_CHECK_AUTHENTICATION_REQUIRED: "false"
    ports:
      - "9000:9000"
      - "8812:8812"
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9003/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  questdb-backup:
    build: .
    depends_on:
      questdb:
        condition: service_healthy
    environment:
      QUESTDB_HOST: questdb
      QUESTDB_USER: questdb
      QUESTDB_PASSWORD: questdb
      BACKUP_ON_START: "TRUE"
      SCHEDULE: "0 3 * * *"
      HEALTHCHECK_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - questdb-data:/var/lib/questdb:ro
      - questdb-backups:/backups

volumes:
  questdb-data:
  questdb-backups:
